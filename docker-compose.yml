services:
  admin:
    container_name: tovapulse-admin
    build:
      context: .
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.tovapulse.com/api/v1}
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-https://api.tovapulse.com}
    restart: unless-stopped
    expose:
      - '3000'
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    networks:
      tovapulse-public:
        aliases:
          - admin

networks:
  tovapulse-public:
    external: true
